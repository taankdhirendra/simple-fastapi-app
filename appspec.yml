version: 0.0

os: linux

file_exists_behavior: OVERWRITE

files:
  - source: /
    destination: /home/ubuntu/fastapi-demo
    
hooks:
  ApplicationStop:
    - location: scripts/stop_container.sh
      timeout: 300
      runas: ubuntu

  AfterInstall:
    - location: scripts/start_container.sh
      timeout: 300
      runas: ubuntu

